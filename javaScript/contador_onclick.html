<!DOCTYPE html>
<!-- crear dos botonos -->
<!-- uno incrementar contador y otro decrementar contador -->
<!-- mostrar el resultado en un parrafo -->
<html>
    <button id="sumar" onclick="sumar()">1+ contador</button>
    <button id="restar" onclick="restar()">-1 contador</button>
    <p id="resultado">Contador: 0</p>
    <script>
        let contador = 0;
        const resultado = document.getElementById("resultado");

        function sumar() {
            contador++;
            console.log("contador: ", contador);
            resultado.textContent = `Contador: ${contador}`;
        }

        function restar() {
            contador--;
            console.log("contador: ", contador);
            resultado.textContent = `Contador: ${contador}`;
        }
    </script>
</html>
